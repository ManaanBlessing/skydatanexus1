<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midstream Data Collection | SkyDataNexus</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
            color: #333;
        }
        
        header {
            background-color: #003366;
            color: white;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-size: 1.8rem;
            font-weight: bold;
        }
        
        nav ul {
            display: flex;
            list-style: none;
        }
        
        nav ul li {
            margin-left: 1.5rem;
        }
        
        nav ul li a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }
        
        nav ul li a:hover {
            color: #ffcc00;
        }
        
        .content {
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .form-container {
            background-color: white;
            padding: 2rem;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        h1 {
            color: #003366;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
            color: #003366;
        }
        
        input[type="text"],
        input[type="number"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
        }
        
        textarea {
            height: 120px;
            resize: vertical;
        }
        
        .btn-submit {
            background-color: #003366;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .btn-submit:hover {
            background-color: #004080;
        }
        
        footer {
            background-color: #003366;
            color: white;
            text-align: center;
            padding: 1.5rem;
            margin-top: 2rem;
        }
        
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                text-align: center;
            }
            
            nav ul {
                margin-top: 1rem;
                flex-direction: column;
                align-items: center;
            }
            
            nav ul li {
                margin: 0.5rem 0;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">SkyDataNexus</div>
        <nav>
            <ul>
                <li><a href="Upstream.html">Upstream Form</a></li>
                <li><a href="Midstream.html">Midstream Form</a></li>
                <li><a href="Downstream.html">Downstream Form</a></li>
                <li><a href="Common.html">common Form</a></li>
            </ul>
        </nav>
    </header>
    
    <div class="content">
        <div class="form-container">
            <h1>Midstream Data Collection Form</h1>
            <form action="Midstream.php"  method="POST">
                
                    <label for="companyName">Company Name</label>
                    <input type="text" id="companyName" name="companyName" required>
                
                
            
                    <label for="pipelineName">Pipeline/Transportation System Name</label>
                    <input type="text" id="pipelineName" name="pipelineName" required>
                
                
                
                    <label for="origin">Origin Point</label>
                    <input type="text" id="origin" name="origin" required>
            
                
                
                    <label for="destination">Destination Point</label>
                    <input type="text" id="destination" name="destination" required>
                
                
                
                    <label for="productType">Product Type</label>
                    <select id="productType" name="productType" required>
                        <option value="">Select product type</option>
                        <option value="crude">Crude Oil</option>
                        <option value="natural_gas">Natural Gas</option>
                        <option value="ngl">Natural Gas Liquids (NGL)</option>
                        <option value="refined">Refined Products</option>
                    </select>
                
                
                
                    <label for="volumeTransported">Volume Transported (barrels or MCF)</label>
                    <input type="number" id="volumeTransported" name="volumeTransported" step="1" required>
                
                
                
                    <label for="transportDate">Transport Date</label>
                    <input type="date" id="transportDate" name="transportDate" required>
                
            
            
                    <label for="pipelineDiameter">Pipeline Diameter (inches)</label>
                    <input type="number" id="pipelineDiameter" name="pipelineDiameter" step="1">
                
                
                
                    <label for="pressure">Operating Pressure (psi)</label>
                    <input type="number" id="pressure" name="pressure" step="1">
                
                
                
                    <label for="storageCapacity">Storage Capacity (if applicable)</label>
                    <input type="number" id="storageCapacity" name="storageCapacity" step="1">
                
                

                    <label for="notes">Additional Notes</label>
                    <textarea id="notes" name="notes"></textarea>
                    
                
                
                <input type="submit" class="btn-submit" value = "Submit">
            </form>
        </div>
    </div>
    
    <footer>
        <p>&copy; 2025 SkyDataNexus. All rights reserved.</p>
    </footer>
    
    <script>
        document.getElementById('midstreamForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Midstream data submitted successfully!');
            this.reset();
        });
    </script>
</body>
</html>
